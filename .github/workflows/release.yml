# Publishes a GitHub Release with the ready-to-load extension zip when a version tag is pushed:
#   git tag v0.9.6 && git push origin v0.9.6
# The tag must match "version" in extension/manifest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi

      - name: Build the zips
        # Release zip: one top-level folder holding manifest.json, so "Load unpacked" points at it.
        # Store zip: manifest.json at the zip root (what the Chrome Web Store requires).
        # Neither needs the tests or the icon generator.
        run: |
          name="fc27-sbc-solver-$GITHUB_REF_NAME"
          mkdir -p "dist/$name"
          cp -r extension/. "dist/$name/"
          rm -rf "dist/$name/test" "dist/$name/icons/make-icons.js"
          (cd dist && zip -r "$name.zip" "$name")
          (cd "dist/$name" && zip -r "../$name-chrome-web-store.zip" .)
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"
          echo "STORE_ZIP=dist/$name-chrome-web-store.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" "$STORE_ZIP" --title "$GITHUB_REF_NAME" --generate-notes
